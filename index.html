function gmaps(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function gnav(origin,dest,wps){
let u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(dest)+"&travelmode=walking";
if(wps&&wps.length)u+="&waypoints="+encodeURIComponent(wps.join("|"));
return u;
}
function pad(n){return String(n).padStart(2,"0");}
function getNextEvent(){
const now=Date.now();
for(const e of TRIP.events){
if(new Date(e.t).getTime()>now)return e;
}
return null;
}
function updateCountdown(){
const el=document.getElementById("cd-card");
if(!el)return;
const ev=getNextEvent();
if(!ev){
el.querySelector(".cd-event").textContent="旅程已完成 🎉";
el.querySelector(".cd-nums").style.display="none";
el.querySelector(".cd-label").textContent="2026年11月13日 — 11月20日";
return;
}
const diff=new Date(ev.t).getTime()-Date.now();
if(diff<0)return;
const d=Math.floor(diff/86400000);
const h=Math.floor(diff%86400000/3600000);
const m=Math.floor(diff%3600000/60000);
const s=Math.floor(diff%60000/1000);
el.querySelector(".cd-event").textContent=ev.l;
el.querySelector(".cd-label").textContent=ev.d;
el.querySelector("#cd-d").textContent=pad(d);
el.querySelector("#cd-h").textContent=pad(h);
el.querySelector("#cd-m").textContent=pad(m);
el.querySelector("#cd-s").textContent=pad(s);
el.querySelector(".cd-tz").textContent="目標時間 "+ev.t.slice(-6).replace("+","UTC+");
}
function detectTheme(){
const hour=new Date().getHours();
const prefersDark=window.matchMedia("(prefers-color-scheme:dark)").matches;
const isNight=hour>=17||hour<7;
const dark=prefersDark||isNight;
document.documentElement.setAttribute("data-theme",dark?"dark":"light");
document.getElementById("themeToggle").textContent=dark?"☀️":"🌙";
}
function toggleTheme(){
const cur=document.documentElement.getAttribute("data-theme");
const next=cur==="dark"?"light":"dark";
document.documentElement.setAttribute("data-theme",next);
document.getElementById("themeToggle").textContent=next==="dark"?"☀️":"🌙";
}

function toggleDay(head){
var body=document.getElementById("day-body-"+head.dataset.day);
head.classList.toggle("open");

}
function openDayNav(di){
var d=TRIP.days[di];
var places=d.items.filter(function(i){return i.place;}).map(function(i){return i.place;});
if(places.length<2)return;
var origin=places[0];
var dest=places[places.length-1];
var wps=places.slice(1,-1);
window.open(gnav(origin,dest,wps),"_blank");
}
